name: Guest Book

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-message:
    if: contains(join(github.event.issue.labels.*.name, ','), 'guestbook')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Debug (optional)
        run: |
          echo "TITLE: ${{ github.event.issue.title }}"
          echo "USER: ${{ github.event.issue.user.login }}"
          echo "LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}"

      - name: Update guest book
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/update_guestbook.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "📮 New guest book entry from @${{ github.event.issue.user.login }}"
          git push

      - name: Thank the visitor
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks for signing the guest book, @${{ github.event.issue.user.login }}! 🎉
            Your message has been added to the guest book. ✨

      - name: Close issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "✅ Added to the guest book!"
